[project]
name = "cellposescp"
version = "0.1.0"
description = """Cellpose-based single-cell phenomics pipeline for microscopy imaging."""
readme = "README.md"
authors = [
    { name = "Mcatstar", email = "lyz_ouc@126.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy (>= 1.21, < 2.4)",
    "pandas (>=3.0.5,<4.0.0)",
    "opencv-python (>=5.0.0.93,<6.0.0.0)",
    "scipy (>=1.18.1,<2.0.0)",
    "tqdm (>=4.70.0,<5.0.0)",
    "scikit-image (>=0.26.0,<0.27.0)",
    "tifffile (>=2026.8.23,<2027.0.0)",
    "loguru (>=0.7.3,<0.8.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "cellpose (<4.0)",
    "typer (>=0.27.2,<0.28.0)",
    "dotenv (>=0.9.9,<0.10.0)",
    "scikit-learn (>=1.9.1,<2.0.0)",
    "pyyaml>=6.0.3",
    "rapidocr>=3.9.2",
    "seaborn>=0.13.2",
    "albumentations>=2.0.8",
]

[project.scripts]
cellposescp = "cellposescp:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false
